<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TIQ – Interview Recording</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5fa;--card:#fff;--ink:#101828;--mute:#667085;--line:#e6eaf2;--pri:#1556c9;--pri-soft:#e8f0fe;--ok:#12a366;--warn:#f0a30a;--bad:#e5484d;--chip:#f5f7fb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1320;--card:#161e2e;--ink:#eef2f9;--mute:#97a3b8;--line:#25304a;--pri:#4b86f0;--pri-soft:#1c2c4d;--chip:#1c2538}}
:root[data-theme="dark"]{--bg:#0d1320;--card:#161e2e;--ink:#eef2f9;--mute:#97a3b8;--line:#25304a;--pri:#4b86f0;--pri-soft:#1c2c4d;--chip:#1c2538}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Plus Jakarta Sans",system-ui,sans-serif}
button{font:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:14px 16px 40px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}
.logo i{width:22px;height:22px;display:grid;grid-template-columns:1fr 1fr;gap:3px}
.logo i b{background:var(--pri);border-radius:3px}.logo i b:nth-child(2){opacity:.6}.logo i b:nth-child(3){opacity:.8}
nav{display:flex;gap:4px;flex:1;justify-content:center;overflow-x:auto;order:3;width:100%}
@media(min-width:900px){nav{order:0;width:auto}}
nav button{background:none;border:0;padding:10px 12px;color:var(--ink);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
nav button[aria-selected=true]{color:var(--pri);border-color:var(--pri);font-weight:600}
.me{display:flex;align-items:center;gap:10px;margin-left:auto}
.me small{display:block;color:var(--mute);font-size:11px}.me b{font-size:13px}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#c2415c,#7c2d5a);color:#fff;display:grid;place-items:center;font-weight:700}
h1{font-size:28px;margin:2px 0 0;font-weight:800}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:16px 0;flex-wrap:wrap}
.top small{color:var(--mute)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:600}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:var(--bad)}.btn:disabled{opacity:.45;cursor:not-allowed}
select,input,textarea{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.grid4{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.grid3{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));margin-top:14px}
.card{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(16,24,40,.06)}
.stat{display:flex;flex-direction:column;gap:6px}
.stat .row{display:flex;justify-content:space-between;align-items:flex-start}
.ic{width:36px;height:36px;border-radius:10px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;font-size:16px}
.pill{font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px}.up{background:#e3f7ec;color:#0b7a4b}.dn{background:#fde8e8;color:#b42318}
.stat .v{font-size:26px;font-weight:800;line-height:1.1}.stat .l{font-weight:600}.stat .s{color:var(--mute);font-size:12px}
.spark{display:flex;align-items:flex-end;gap:3px;height:34px}.spark i{width:5px;background:var(--pri-soft);border-radius:2px}.spark i:last-child{background:var(--pri)}
.stack{display:flex;height:9px;border-radius:6px;overflow:hidden;background:var(--chip);margin:12px 0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--chip);border-radius:10px;padding:10px;text-align:center}.tile small{color:var(--mute);display:flex;gap:5px;justify-content:center;align-items:center}
.tile b{font-size:19px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.sec{font-size:11px;color:var(--mute);font-weight:600;margin:14px 0 6px}
.flow{display:grid;grid-template-columns:1fr 70px 44px;gap:8px;align-items:center;background:var(--chip);padding:8px 10px;border-radius:8px;margin-bottom:6px;font-size:13px}
.bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;border-radius:4px}
.mrow{display:grid;grid-template-columns:110px 1fr 42px;gap:10px;align-items:center;margin:11px 0;font-size:13px}
.big{font-size:28px;font-weight:800;color:var(--pri)}
.miss{background:#fff7dd;color:#5c4400;border:1px solid #f4dc8a;border-radius:10px;padding:10px;margin-top:16px}
.miss span{display:inline-block;background:#f9d65c;border-radius:6px;padding:2px 8px;margin:6px 6px 0 0;font-size:12px;font-weight:600}
.ai{background:linear-gradient(160deg,#1556c9,#0f46a8);color:#fff;display:flex;flex-direction:column;gap:10px;min-height:340px}
.ai .on{font-size:11px;background:rgba(255,255,255,.2);padding:3px 9px;border-radius:10px;margin-left:auto}
.ai .q{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:9px;padding:10px 12px;text-align:left}
.ai .ans{background:rgba(255,255,255,.95);color:#10223f;border-radius:10px;padding:10px 12px;font-size:13px;white-space:pre-line}
.ai form{display:flex;gap:8px;margin-top:auto}.ai input{border:0}
.ai form button{background:#1b6ff0;border:0;color:#fff;border-radius:50%;width:38px;height:38px;flex:none}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--mute);font-weight:600}
.tbl{overflow-x:auto}
.stg{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--pri-soft);color:var(--pri)}
.rec{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.vid{background:#0a0f1c;border-radius:12px;aspect-ratio:16/9;width:100%;object-fit:cover;display:block}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tm{font-variant-numeric:tabular-nums;font-weight:800;font-size:22px;display:flex;align-items:center;gap:8px}
.live{width:10px;height:10px;border-radius:50%;background:var(--bad);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}@media(prefers-reduced-motion:reduce){.live{animation:none}}
.lbl{font-size:12px;color:var(--mute);font-weight:600;display:block;margin:10px 0 4px}
.mk{display:flex;gap:8px;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line)}.mk b{color:var(--pri);min-width:44px}
.item{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.item video{width:100%;border-radius:10px;background:#000;max-height:220px}
.note{color:var(--mute);font-size:12px}
.hide{display:none}
</style>
<style>nav{justify-content:flex-start}.grid2{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-top:10px}</style>
<link rel="manifest" href="/manifest.json" crossorigin="use-credentials"><meta name="theme-color" content="#1556c9"><link rel="apple-touch-icon" href="/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><style>.ov{position:fixed;inset:0;background:rgba(10,15,28,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 10px 24px}.ov.hide{display:none}.mc{background:var(--card);border-radius:16px;width:min(1100px,100%);padding:16px}.cg{display:grid;gap:10px;align-items:center;margin:8px 0}.cc{border:1px solid var(--line);border-radius:12px;padding:10px}.cc.lead{border-color:#1aa3a3;background:var(--pri-soft)}.top1{background:var(--pri-soft);border-radius:12px;padding:12px;margin:12px 0}.lnk{background:none;border:0;color:var(--pri);font-weight:600;padding:0}.rg{display:grid;gap:14px;grid-template-columns:1fr;margin-top:12px}@media(min-width:900px){.rg{grid-template-columns:1.1fr 1fr}}.cr{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}.cr b span{color:var(--mute);font-weight:500}.cbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;justify-content:flex-end}.cbar.hide{display:none}</style><style>.dg{display:grid;gap:14px;margin-top:14px}.d4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.d2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}.d3{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}.flt{display:flex;gap:8px;flex-wrap:wrap}.flt select{width:auto}.sc{border-radius:14px;padding:16px}.sc .v{font-size:26px;font-weight:800}.sc .ic{margin-bottom:8px}.s1{background:rgba(21,86,201,.10)}.s2{background:rgba(18,163,102,.12)}.s3{background:rgba(139,92,246,.12)}.s4{background:rgba(240,163,10,.14)}.tabs2{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}.tabs2 button{background:none;border:0;padding:6px 8px;color:var(--mute);border-bottom:2px solid transparent}.tabs2 button.on{color:var(--pri);border-color:var(--pri);font-weight:600}.ban{background:rgba(18,163,102,.12);border-radius:10px;padding:12px;font-size:13px}.fn{display:grid;grid-template-columns:repeat(4,1fr)}.fn div{padding:12px 8px 12px 20px;clip-path:polygon(0 0,90% 0,100% 50%,90% 100%,0 100%,8% 50%);margin-right:-8px;font-weight:800;font-size:18px;color:#10223f}.fn small{display:block;font-weight:600;font-size:11px}.ins{background:rgba(240,163,10,.14);border-radius:10px;padding:10px;font-size:13px;margin-top:10px}.li{display:flex;gap:8px;font-size:13px;margin:6px 0}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.mini div{background:var(--chip);border-radius:10px;padding:10px}.mini b{font-size:20px;display:block}</style></head>
<body>
<div class="wrap">
<header><div class="logo"><i><b></b><b></b><b></b><b></b></i>TIQ</div><nav role="tablist" id="nav"></nav><div class="me"><div><b>Hiring team</b><small>Live data</small></div><div class="av">HT</div></div></header>
<div id="msg" class="note" style="color:var(--bad);padding-top:8px"></div>

<section id="v-overview"><div class="top"><div><h1>Welcome to TIQ</h1><small>Your recruitment overview</small></div><div class="flt"><select id="fj" aria-label="Job"></select><select id="fl" aria-label="Location"></select><select id="fd" aria-label="Date range"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option><option value="0">All time</option></select></div></div><div id="dash"></div></section>

<section id="v-jobs" class="hide"><div class="top"><div><small>Hiring</small><h1>Jobs</h1></div></div>
 <div class="card" style="margin-bottom:14px"><b>Post a job</b><div class="grid2"><input id="jt" placeholder="Job title" aria-label="Job title"><input id="jd" placeholder="Department" aria-label="Department"><input id="jl" placeholder="Location" aria-label="Location"><button class="btn" id="ja">Post job</button></div></div>
 <div class="card tbl"><table><thead><tr><th>Title</th><th>Department</th><th>Location</th><th>Candidates</th><th>Status</th></tr></thead><tbody id="jtb"></tbody></table></div></section>

<section id="v-candidates" class="hide"><div class="top"><div><small>Pipeline</small><h1>Candidates</h1></div><div style="display:flex;gap:8px"><input id="srch" placeholder="Search name or role" style="max-width:220px" aria-label="Search candidates"><select id="sortc" style="max-width:170px" aria-label="Sort candidates"><option value="new">Newest first</option><option value="rank">Top performers</option></select><button class="btn ghost" id="ctop">Compare top 3</button></div></div>
 <div class="card" style="margin-bottom:14px"><b>Add a candidate</b><div class="grid2"><input id="cn" placeholder="Full name" aria-label="Full name"><input id="ce" type="email" placeholder="Email" aria-label="Email"><select id="cj" aria-label="Job"></select><button class="btn" id="ca">Add candidate</button></div></div>
 <div class="card tbl"><table><thead><tr><th></th><th>Rank</th><th>Name</th><th>Role</th><th>Stage</th><th>Score</th><th></th></tr></thead><tbody id="ctb"></tbody></table></div></section>

<section id="v-interviews" class="hide"><div class="top"><div><small>Meeting bot and AI feedback</small><h1>Interviews</h1></div></div>
 <div class="card" style="margin-bottom:14px"><b>New interview</b><div class="grid2"><select id="ic" aria-label="Candidate"></select><input id="iu" placeholder="Meet, Zoom or Teams link" aria-label="Meeting link"><input id="iw" type="datetime-local" aria-label="Date and time"><input id="ii" placeholder="Interviewer" aria-label="Interviewer"><input id="it" placeholder="Tech stack, e.g. React, Node.js, AWS" aria-label="Tech stack"></div>
  <label style="display:flex;gap:8px;margin-top:12px;align-items:flex-start"><input type="checkbox" id="ik" style="width:auto;margin-top:3px"><span class="note">The candidate has consented to this interview being recorded and transcribed.</span></label>
  <div class="ctl"><button class="btn" id="ia">Create interview</button></div></div>
 <div class="card"><b>Interviews</b><div id="ilist"></div></div></section>

<section id="v-reports" class="hide"><div class="top"><div><small>Insights</small><h1>Reports</h1></div><button class="btn" id="rx">Export interviews CSV</button></div><div class="grid3" id="rp"></div></section>
</div>
<div id="modal" class="ov hide" role="dialog" aria-modal="true"></div><div id="cbar" class="cbar hide"><span id="cbn" class="note"></span><button class="btn ghost" id="cclr">Clear</button><button class="btn" id="cgo">Compare</button></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST=["Shortlisted","Scheduled","Interviewed","Recommended","Selected","Dropped"],COL=["#1556c9","#4aa8f0","#12a366","#f0a30a","#12a366","#e5484d"];
const SC={scheduled:'Scheduled',bot_sent:'Bot sent, waiting for meeting',analyzing:'Analysing with Gemini',done:'Analysed',failed:'Failed'};
let D={jobs:[],candidates:[],interviews:[]};
async function api(p,b){const r=await fetch(p,b===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(r.status===401){location.href='/login';throw new Error('Please sign in')}if(!r.ok){let m=r.statusText;try{m=(await r.json()).error||m}catch(e){}throw new Error(m)}return r.json().catch(()=>({}))}
const run=async f=>{try{await f();await load()}catch(e){$('#msg').textContent=e.message}};
const jobOf=c=>D.jobs.find(j=>j.id===c.job_id),cand=id=>D.candidates.find(c=>c.id===id)||{name:'Unknown'};
const done=()=>D.interviews.filter(i=>i.status==='done'),cnt=s=>D.candidates.filter(c=>c.stage===s).length;
const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
const byJob=()=>D.jobs.map(j=>[j.title,avg(done().filter(i=>jobOf(cand(i.candidate_id))&&jobOf(cand(i.candidate_id)).id===j.id).map(i=>i.score))]).filter(x=>x[1]!=null);
const skills=()=>{const s={};done().forEach(i=>((i.feedback&&i.feedback.missing_skills)||[]).forEach(k=>{k=String(k).trim();if(k)s[k]=(s[k]||0)+1}));return Object.entries(s).sort((a,b)=>b[1]-a[1])};
async function load(){try{D=await api('/api/state');$('#msg').textContent='';render()}catch(e){$('#msg').textContent='Cannot reach the TIQ server: '+e.message}}
function keep(id,f){const e=$(id),v=e.value;f();e.value=v}
function render(){drawO();drawJ();drawC();drawI();drawR()}
const F={job:'',loc:'',days:30},SK={tab:'tech',cid:null};
const pcs=(n,d)=>d?Math.round(n/d*100)+'%':'–',avgN=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
const stgCol=s=>({Shortlisted:'#1556c9',Scheduled:'#4aa8f0',Interviewed:'#8b5cf6',Recommended:'#12a366',Selected:'#0b7a4b',Dropped:'#e5484d'})[s]||'#667085';
const brow=(l,v,c)=>`<div class="mrow" style="grid-template-columns:120px 1fr 44px"><span>${esc(l)}</span><div class="bar"><i style="width:${v}%;background:${c||'var(--ok)'}"></i></div><b>${v}%</b></div>`;
function drawO(){
 const jf=$('#fj'),lf=$('#fl'),jv=jf.value,lv=lf.value;
 jf.innerHTML='<option value="">All jobs</option>'+D.jobs.map(j=>`<option value="${j.id}">${esc(j.title)}</option>`).join('');jf.value=jv;
 lf.innerHTML='<option value="">All locations</option>'+[...new Set(D.jobs.map(j=>j.location).filter(Boolean))].map(l=>`<option>${esc(l)}</option>`).join('');lf.value=lv;
 const jobIds=new Set(D.jobs.filter(j=>(!F.job||String(j.id)===F.job)&&(!F.loc||j.location===F.loc)).map(j=>j.id)),filt=F.job||F.loc;
 const base=D.candidates.filter(c=>!filt||jobIds.has(c.job_id)),bid=new Set(base.map(c=>c.id));
 const ts=x=>new Date(x).getTime(),its=i=>ts(String(i.created).replace(' ','T')+'Z'),inR=t=>!F.days||Date.now()-t<=F.days*864e5;
 const cs=base.filter(c=>inR(ts(c.created))),ivAll=D.interviews.filter(i=>bid.has(i.candidate_id)),iv=ivAll.filter(i=>inR(its(i)));
 const dnAll=ivAll.filter(i=>i.status==='done'&&i.feedback),dn=iv.filter(i=>i.status==='done'&&i.feedback);
 const rec=dn.filter(i=>i.recommendation==='Recommended').length,rej=dn.filter(i=>i.recommendation==='Not a fit').length;
 const dur=dn.filter(i=>i.duration_sec),hrs=(dur.reduce((a,i)=>a+i.duration_sec,0)/3600).toFixed(1),avgMin=avgN(dur.map(i=>i.duration_sec/60));
 // trend (last 4 weeks)
 const wk=[0,1,2,3].map(k=>{const a=Date.now()-(4-k)*6048e5,b=a+6048e5,w=dnAll.filter(i=>its(i)>=a&&its(i)<b);return w.length?[Math.round(w.filter(i=>i.recommendation==='Recommended').length/w.length*100),Math.round(w.filter(i=>i.recommendation==='Not a fit').length/w.length*100)]:null});
 const X=k=>50+k*90,Y=v=>130-v*1.1,line=(x,c)=>{const p=wk.map((w,k)=>w?[X(k),Y(w[x])]:null).filter(Boolean);return p.length?`<polyline points="${p.map(q=>q.join(',')).join(' ')}" fill="none" stroke="${c}" stroke-width="2.5"/>${p.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="${c}"/>`).join('')}`:''};
 const trend=`<svg viewBox="0 0 340 165" style="width:100%">${[0,25,50,75,100].map(v=>`<line x1="38" x2="330" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="32" y="${Y(v)+4}" font-size="10" text-anchor="end" fill="var(--mute)">${v}%</text>`).join('')}${[0,1,2,3].map(k=>`<text x="${X(k)}" y="158" font-size="10" text-anchor="middle" fill="var(--mute)">Week ${k+1}</text>`).join('')}${line(0,'#1556c9')}${line(1,'#e5484d')}</svg>`;
 // skills
 const sm={};dn.forEach(i=>((i.feedback.tech_feedback&&i.feedback.tech_feedback.skills)||[]).forEach(s=>{if(!s.skill||!(+s.rating>0))return;const k=String(s.skill).trim().toLowerCase();(sm[k]=sm[k]||{n:s.skill,t:0,c:0});sm[k].t+=+s.rating;sm[k].c++}));
 const skl=Object.values(sm).sort((a,b)=>b.c-a.c||b.t/b.c-a.t/a.c).slice(0,5).map(x=>[x.n,Math.round(x.t/x.c*10)]);
 // benchmark
 const rows=cs.map(c=>{const l=dn.filter(i=>i.candidate_id===c.id).sort((a,b)=>a.id-b.id);return{c,l,avg:avgN(l.map(i=>i.score))}}).filter(r=>r.avg!=null).sort((a,b)=>b.avg-a.avg);
 const ins=rows.length>1?`Insight: ${esc(rows[0].c.name)} leads ${esc(rows[1].c.name)} by ${rows[0].avg-rows[1].avg} pts on average AI score.`:'Not enough analysed candidates to rank yet.';
 // interviewers
 const im={};dn.forEach(i=>{const k=i.interviewer||'Unassigned';(im[k]=im[k]||[]).push(i.score)});
 const ia=Object.entries(im).map(([n,s])=>({n,c:s.length,a:avgN(s)})).sort((a,b)=>b.a-a.a),lis=[];

function techBlock(t,stack){if(!t)return stack?'<div class="cr"><b>Technical feedback</b><div class="note">Tap Re-run AI feedback on this interview to get technical feedback.</div></div>':'';
 const sk=(t.skills||[]).map(x=>{const r=Math.max(0,Math.min(10,Math.round(+x.rating||0)));return`<div class="mrow" style="align-items:start"><span>${esc(x.skill)}</span><div><div class="bar"><i style="width:${r*10}%;background:${r>=7?'var(--ok)':r>=4?'var(--warn)':'var(--bad)'}"></i></div><div class="note">${esc(x.evidence)}</div></div><b>${r}/10</b></div>`}).join('');
 return`<div class="cr"><b>Technical feedback <span>${esc(t.level||'')}</span></b>${stack?`<div class="note">Tech stack: ${esc(stack)}</div>`:''}<div style="margin:6px 0">${esc(t.summary)}</div>${sk}${(t.gaps||[]).length?`<div class="note"><b>Gaps:</b> ${esc(t.gaps.join('; '))}</div>`:''}${(t.follow_up_questions||[]).length?`<div class="note"><b>Suggested follow-up questions:</b><ul style="margin:4px 0;padding-left:18px">${t.follow_up_questions.map(q=>`<li>${esc(q)}</li>`).join('')}</ul></div>`:''}</div>`}
function report(id){
 const i=D.interviews.find(x=>x.id===id),f=i&&i.feedback;if(!f)return;
 const c=cand(i.candidate_id),cr=f.criteria||[],auto=i.auto_score!=null?i.auto_score:i.score,C2=2*Math.PI*54,when=i.created?new Date(i.created.replace(' ','T')+'Z').toLocaleString():'';
 const tf=reviewBlock(f.answer_review,f)+techBlock(f.tech_feedback,i.tech_stack);const vid=i.recording_url?`<video class="vid" controls playsinline src="${esc(i.recording_url)}"></video>`:'<div class="vid" style="display:grid;place-items:center;color:#9aa6bb">No recording link</div>';
 modal(`<div class="mc"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:18px">${esc(c.name)} · Interview report</b><button class="btn ghost" data-close="1" aria-label="Close">✕</button></div><div class="rg"><div>${vid}<div class="note">Recorded on ${esc(when)}</div><div class="sec">VIDEO SUMMARY</div><ul style="margin:0;padding-left:18px">${(f.summary_bullets&&f.summary_bullets.length?f.summary_bullets:[f.summary]).map(b=>`<li>${esc(b)}</li>`).join('')}</ul>
 <div class="cr" style="margin-top:12px"><div style="font-size:34px;font-weight:800">${i.score}<span style="font-size:16px;color:var(--mute)"> /100</span></div><div class="note">Scoring rubric: Standard interview. AI may make mistakes, so verify important details.</div><div class="ctl"><button class="btn ghost" data-tr="${i.id}">Check transcription</button><button class="btn ghost" data-sc="1">Strengths and concerns</button></div><div id="sc1" class="hide note"><b>Strengths:</b> ${esc((f.strengths||[]).join('; '))}<br><b>Concerns:</b> ${esc((f.concerns||[]).join('; '))}<br><b>Missing skills:</b> ${esc((f.missing_skills||[]).join('; '))}</div><pre id="trp" class="hide" style="white-space:pre-wrap;max-height:240px;overflow:auto;font-size:12px"></pre></div></div>
 <div><b>How we calculate the score:</b><div class="cr" style="display:flex;gap:16px;align-items:center;margin-top:10px"><svg width="110" height="110" viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="60" cy="60" r="54" fill="none" stroke="var(--pri)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C2*auto/100} ${C2}" transform="rotate(-90 60 60)"/></svg><div><div class="note">Auto-Score</div><div style="font-size:30px;font-weight:800">${auto}<span style="font-size:15px;color:var(--mute)"> /100</span></div>${i.override_score!=null?`<div class="note">Overridden to ${i.override_score}</div>`:''}</div></div>
 ${cr.length?cr.map((x,k)=>`<div class="cr"><b>${k+1}. ${esc(x.name)} <span>${x.score}/${x.max}</span></b><div class="note">${esc(x.reason)}</div></div>`).join(''):'<p class="note">This interview was analysed before detailed scoring existed. Tap Re-run AI feedback on the interview to get the breakdown.</p>'}
 ${tf}
 <div class="cr"><div class="note">Not convinced by this auto score?</div><div class="ctl"><input id="ovv" type="number" min="0" max="100" placeholder="0-100" style="width:110px" aria-label="Override score"><button class="btn" data-ov="set" data-id="${i.id}">Override score</button>${i.override_score!=null?`<button class="btn ghost" data-ov="reset" data-id="${i.id}">Use auto score</button>`:''}</div></div></div></div></div>`);
}
$('#modal').onclick=async e=>{const b=e.target.closest('button');if(e.target.id==='modal'||(b&&b.dataset.close)){$('#modal').classList.add('hide');return}if(!b)return;
 if(b.dataset.mode)compare(b.dataset.mode);
 if(b.dataset.rp)report(+b.dataset.rp);
 if(b.dataset.sc)$('#sc1').classList.toggle('hide');
 if(b.dataset.tr){const p=$('#trp');try{p.textContent=(await api('/api/interviews/'+b.dataset.tr+'/transcript')).transcript||'No transcript.';p.classList.toggle('hide')}catch(x){$('#msg').textContent=x.message}}
 if(b.dataset.ov){const v=b.dataset.ov==='reset'?null:$('#ovv').value;if(v!==null&&(v===''||+v<0||+v>100)){$('#msg').textContent='Enter a score from 0 to 100.';return}await run(()=>api('/api/interviews/'+b.dataset.id+'/override',{score:v}));report(+b.dataset.id)}};
const tabs=["Overview","Jobs","Candidates","Interviews","Reports"],nav=$('#nav');
function show(n){tabs.forEach(t=>$('#v-'+t.toLowerCase()).classList.toggle('hide',t!==n));[...nav.children].forEach(b=>b.setAttribute('aria-selected',b.textContent===n));try{history.replaceState(null,'','#'+n.toLowerCase())}catch(e){}}
tabs.forEach(t=>{const b=document.createElement('button');b.textContent=t;b.setAttribute('role','tab');b.onclick=()=>show(t);nav.append(b)});
$('#ja').onclick=()=>run(async()=>{await api('/api/jobs',{title:$('#jt').value.trim(),dept:$('#jd').value.trim(),location:$('#jl').value.trim()});['#jt','#jd','#jl'].forEach(s=>$(s).value='')});
$('#jtb').onclick=e=>{const b=e.target.closest('button');if(b)run(()=>api('/api/jobs/'+b.dataset.t+'/toggle',{}))};
$('#ca').onclick=()=>run(async()=>{await api('/api/candidates',{name:$('#cn').value.trim(),email:$('#ce').value.trim(),job_id:+$('#cj').value||null});$('#cn').value=$('#ce').value=''});
$('#srch').oninput=drawC;$('#sortc').onchange=drawC;$('#cclr').onclick=()=>{SEL.clear();drawC()};$('#cgo').onclick=()=>compare('h2h');$('#ctop').onclick=()=>{const rk=rankMap();SEL.clear();Object.keys(rk).filter(k=>rk[k]<=3).forEach(k=>SEL.add(+k));drawC();compare('h2h')};
$('#ctb').onchange=e=>{if(e.target.dataset.k){toggleSel(+e.target.dataset.k,e.target.checked);return}if(e.target.dataset.s)run(()=>api('/api/candidates/'+e.target.dataset.s+'/stage',{stage:e.target.value}))};
$('#ctb').onclick=e=>{const b=e.target.closest('button');if(b){$('#ic').value=b.dataset.i;show('Interviews')}};
$('#ia').onclick=()=>{if(!$('#ik').checked){$('#msg').textContent='Confirm the candidate’s consent first.';return}run(async()=>{await api('/api/interviews',{candidate_id:+$('#ic').value,meeting_url:$('#iu').value.trim(),scheduled_at:$('#iw').value||null,interviewer:$('#ii').value.trim(),tech_stack:$('#it').value.trim()});$('#iu').value='';$('#it').value='';$('#ik').checked=false})};
$('#ilist').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.rp)report(+b.dataset.rp);
 if(b.dataset.b)run(()=>api('/api/interviews/'+b.dataset.b+'/bot',{}));
 if(b.dataset.re)run(()=>api('/api/interviews/'+b.dataset.re+'/reanalyze',{}));
 if(b.dataset.tr){const p=$('#t'+b.dataset.tr);try{p.textContent=(await api('/api/interviews/'+b.dataset.tr+'/transcript')).transcript||'No transcript.';p.classList.toggle('hide')}catch(x){$('#msg').textContent=x.message}}};
setInterval(()=>{if(D.interviews.some(i=>i.status==='bot_sent'||i.status==='analyzing'))load()},15000);
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
const h=(location.hash||'').slice(1);show(tabs.find(t=>t.toLowerCase()===h)||'Overview');load();
</script>
</body>
</html>
