<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TIQ – Interview Recording</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5fa;--card:#fff;--ink:#101828;--mute:#667085;--line:#e6eaf2;--pri:#1556c9;--pri-soft:#e8f0fe;--ok:#12a366;--warn:#f0a30a;--bad:#e5484d;--chip:#f5f7fb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1320;--card:#161e2e;--ink:#eef2f9;--mute:#97a3b8;--line:#25304a;--pri:#4b86f0;--pri-soft:#1c2c4d;--chip:#1c2538}}
:root[data-theme="dark"]{--bg:#0d1320;--card:#161e2e;--ink:#eef2f9;--mute:#97a3b8;--line:#25304a;--pri:#4b86f0;--pri-soft:#1c2c4d;--chip:#1c2538}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Plus Jakarta Sans",system-ui,sans-serif}
button{font:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:14px 16px 40px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}
.logo i{width:22px;height:22px;display:grid;grid-template-columns:1fr 1fr;gap:3px}
.logo i b{background:var(--pri);border-radius:3px}.logo i b:nth-child(2){opacity:.6}.logo i b:nth-child(3){opacity:.8}
nav{display:flex;gap:4px;flex:1;justify-content:center;overflow-x:auto;order:3;width:100%}
@media(min-width:900px){nav{order:0;width:auto}}
nav button{background:none;border:0;padding:10px 12px;color:var(--ink);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
nav button[aria-selected=true]{color:var(--pri);border-color:var(--pri);font-weight:600}
.me{display:flex;align-items:center;gap:10px;margin-left:auto}
.me small{display:block;color:var(--mute);font-size:11px}.me b{font-size:13px}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#c2415c,#7c2d5a);color:#fff;display:grid;place-items:center;font-weight:700}
h1{font-size:28px;margin:2px 0 0;font-weight:800}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:16px 0;flex-wrap:wrap}
.top small{color:var(--mute)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:600}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:var(--bad)}.btn:disabled{opacity:.45;cursor:not-allowed}
select,input,textarea{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.grid4{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.grid3{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));margin-top:14px}
.card{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(16,24,40,.06)}
.stat{display:flex;flex-direction:column;gap:6px}

.ic{width:36px;height:36px;border-radius:10px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;font-size:16px}
.pill{font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px}.up{background:#e3f7ec;color:#0b7a4b}.dn{background:#fde8e8;color:#b42318}
.stat .v{font-size:26px;font-weight:800;line-height:1.1}.stat .l{font-weight:600}.stat .s{color:var(--mute);font-size:12px}
.spark{display:flex;align-items:flex-end;gap:3px;height:34px}.spark i{width:5px;background:var(--pri-soft);border-radius:2px}.spark i:last-child{background:var(--pri)}
.stack{display:flex;height:9px;border-radius:6px;overflow:hidden;background:var(--chip);margin:12px 0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--chip);border-radius:10px;padding:10px;text-align:center}.tile small{color:var(--mute);display:flex;gap:5px;justify-content:center;align-items:center}
.tile b{font-size:19px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.sec{font-size:11px;color:var(--mute);font-weight:600;margin:14px 0 6px}
.flow{display:grid;grid-template-columns:1fr 70px 44px;gap:8px;align-items:center;background:var(--chip);padding:8px 10px;border-radius:8px;margin-bottom:6px;font-size:13px}
.bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;border-radius:4px}
.mrow{display:grid;grid-template-columns:110px 1fr 42px;gap:10px;align-items:center;margin:11px 0;font-size:13px}
.big{font-size:28px;font-weight:800;color:var(--pri)}
.miss{background:#fff7dd;color:#5c4400;border:1px solid #f4dc8a;border-radius:10px;padding:10px;margin-top:16px}
.miss span{display:inline-block;background:#f9d65c;border-radius:6px;padding:2px 8px;margin:6px 6px 0 0;font-size:12px;font-weight:600}
.ai{background:linear-gradient(160deg,#1556c9,#0f46a8);color:#fff;display:flex;flex-direction:column;gap:10px;min-height:340px}
.ai .on{font-size:11px;background:rgba(255,255,255,.2);padding:3px 9px;border-radius:10px;margin-left:auto}
.ai .q{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:9px;padding:10px 12px;text-align:left}
.ai .ans{background:rgba(255,255,255,.95);color:#10223f;border-radius:10px;padding:10px 12px;font-size:13px;white-space:pre-line}
.ai form{display:flex;gap:8px;margin-top:auto}.ai input{border:0}
.ai form button{background:#1b6ff0;border:0;color:#fff;border-radius:50%;width:38px;height:38px;flex:none}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--mute);font-weight:600}
.tbl{overflow-x:auto}
.stg{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--pri-soft);color:var(--pri)}
.rec{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.vid{background:#0a0f1c;border-radius:12px;aspect-ratio:16/9;width:100%;object-fit:cover;display:block}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tm{font-variant-numeric:tabular-nums;font-weight:800;font-size:22px;display:flex;align-items:center;gap:8px}
.live{width:10px;height:10px;border-radius:50%;background:var(--bad);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}@media(prefers-reduced-motion:reduce){.live{animation:none}}
.lbl{font-size:12px;color:var(--mute);font-weight:600;display:block;margin:10px 0 4px}
.mk{display:flex;gap:8px;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line)}.mk b{color:var(--pri);min-width:44px}
.item{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.item video{width:100%;border-radius:10px;background:#000;max-height:220px}
.note{color:var(--mute);font-size:12px}
.hide{display:none}
</style>

  body=`<div class="sec">WHERE THEY DIFFER MOST</div>${diff.map(r=>`<div class="cg" style="${cols}"><b>${r.n}</b>${r.v.map(bar).join('')}</div>`).join('')||'<p class="note">The candidates are evenly matched on every dimension.</p>'}${even.length?`<p class="note">Evenly matched on ${even.map(r=>r.n).join(', ')}.</p>`:''}<div class="sec">VOICE CHARACTER (estimated from the transcript wording, not the audio)</div>${[["pace","Pace"],["tone","Tone"],["sentiment","Sentiment"]].map(x=>`<div class="cg" style="${cols}"><span>${x[1]}</span>${P.map(p=>`<span style="text-align:center">${esc(p.v[x[0]]||'–')}</span>`).join('')}</div>`).join('')}<div class="sec">WHAT EACH BRINGS</div><div class="cg" style="grid-template-columns:repeat(${n},1fr)">${brings}</div>`;
 }
 modal(`<div class="mc" style="overflow-x:auto"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><b style="font-size:18px">Compare Candidates (${n})</b><div style="display:flex;gap:6px"><button class="btn${compare.mode==='radar'?' ghost':''}" data-mode="h2h">Head-to-head</button><button class="btn${compare.mode==='radar'?'':' ghost'}" data-mode="radar">Radar</button><button class="btn ghost" data-close="1" aria-label="Close">✕</button></div></div><div class="top1">🏆 <b>Top pick: ${esc(P[0].c.name)}</b><div class="note">${lead>0?'Leads by '+lead+' pts on score':'Tied on score'}</div></div>${noDim.length?`<p class="note">No detailed dimensions yet for ${esc(noDim.join(', '))}. Tap Re-run AI feedback on their interview to include them.</p>`:''}<div class="cg" style="${cols}"><span class="sec" style="margin:0">CANDIDATE</span>${head}</div>${body}</div>`);
}
function reviewBlock(a,f){if(!a||!a.length)return f&&f.tech_feedback?'':'<div class="cr"><b>Technical justification</b><div class="note">Tap Re-run AI feedback on this interview to get an answer-by-answer review.</div></div>';
 const vc=v=>/^correct/i.test(v)?'var(--ok)':/partial/i.test(v)?'var(--warn)':'var(--bad)';
 return`<div class="cr"><b>Technical justification: what was right and wrong</b>${a.map(x=>`<div style="border-top:1px solid var(--line);padding:10px 0"><div><b>${esc(x.question)}</b> <span class="stg" style="background:none;border:1px solid ${vc(x.verdict)};color:${vc(x.verdict)}">${esc(x.verdict)}</span></div><div class="note"><b>Candidate said:</b> ${esc(x.candidate_answer)}</div><div style="font-size:13px"><b>What was wrong or missing:</b> ${esc(x.what_was_wrong)}</div><div class="note"><b>A better answer:</b> ${esc(x.ideal_answer)}</div></div>`).join('')}</div>`}
function techBlock(t,stack){if(!t)return stack?'<div class="cr"><b>Technical feedback</b><div class="note">Tap Re-run AI feedback on this interview to get technical feedback.</div></div>':'';
 const sk=(t.skills||[]).map(x=>{const r=Math.max(0,Math.min(10,Math.round(+x.rating||0)));return`<div class="mrow" style="align-items:start"><span>${esc(x.skill)}</span><div><div class="bar"><i style="width:${r*10}%;background:${r>=7?'var(--ok)':r>=4?'var(--warn)':'var(--bad)'}"></i></div><div class="note">${esc(x.evidence)}</div></div><b>${r}/10</b></div>`}).join('');
 return`<div class="cr"><b>Technical feedback <span>${esc(t.level||'')}</span></b>${stack?`<div class="note">Tech stack: ${esc(stack)}</div>`:''}<div style="margin:6px 0">${esc(t.summary)}</div>${sk}${(t.gaps||[]).length?`<div class="note"><b>Gaps:</b> ${esc(t.gaps.join('; '))}</div>`:''}${(t.follow_up_questions||[]).length?`<div class="note"><b>Suggested follow-up questions:</b><ul style="margin:4px 0;padding-left:18px">${t.follow_up_questions.map(q=>`<li>${esc(q)}</li>`).join('')}</ul></div>`:''}</div>`}
function report(id){
 const i=D.interviews.find(x=>x.id===id),f=i&&i.feedback;if(!f)return;
 const c=cand(i.candidate_id),cr=f.criteria||[],auto=i.auto_score!=null?i.auto_score:i.score,C2=2*Math.PI*54,when=i.created?new Date(i.created.replace(' ','T')+'Z').toLocaleString():'';
 const tf=reviewBlock(f.answer_review,f)+techBlock(f.tech_feedback,i.tech_stack);const vid=i.recording_url?`<video class="vid" controls playsinline src="${esc(i.recording_url)}"></video>`:'<div class="vid" style="display:grid;place-items:center;color:#9aa6bb">No recording link</div>';
 modal(`<div class="mc"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:18px">${esc(c.name)} · Interview report</b><button class="btn ghost" data-close="1" aria-label="Close">✕</button></div><div class="rg"><div>${vid}<div class="note">Recorded on ${esc(when)}</div><div class="sec">VIDEO SUMMARY</div><ul style="margin:0;padding-left:18px">${(f.summary_bullets&&f.summary_bullets.length?f.summary_bullets:[f.summary]).map(b=>`<li>${esc(b)}</li>`).join('')}</ul>
 <div class="cr" style="margin-top:12px"><div style="font-size:34px;font-weight:800">${i.score}<span style="font-size:16px;color:var(--mute)"> /100</span></div><div class="note">Scoring rubric: Standard interview. AI may make mistakes, so verify important details.</div><div class="ctl"><button class="btn ghost" data-tr="${i.id}">Check transcription</button><button class="btn ghost" data-sc="1">Strengths and concerns</button></div><div id="sc1" class="hide note"><b>Strengths:</b> ${esc((f.strengths||[]).join('; '))}<br><b>Concerns:</b> ${esc((f.concerns||[]).join('; '))}<br><b>Missing skills:</b> ${esc((f.missing_skills||[]).join('; '))}</div><pre id="trp" class="hide" style="white-space:pre-wrap;max-height:240px;overflow:auto;font-size:12px"></pre></div></div>
 <div><b>How we calculate the score:</b><div class="cr" style="display:flex;gap:16px;align-items:center;margin-top:10px"><svg width="110" height="110" viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="60" cy="60" r="54" fill="none" stroke="var(--pri)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C2*auto/100} ${C2}" transform="rotate(-90 60 60)"/></svg><div><div class="note">Auto-Score</div><div style="font-size:30px;font-weight:800">${auto}<span style="font-size:15px;color:var(--mute)"> /100</span></div>${i.override_score!=null?`<div class="note">Overridden to ${i.override_score}</div>`:''}</div></div>
 ${cr.length?cr.map((x,k)=>`<div class="cr"><b>${k+1}. ${esc(x.name)} <span>${x.score}/${x.max}</span></b><div class="note">${esc(x.reason)}</div></div>`).join(''):'<p class="note">This interview was analysed before detailed scoring existed. Tap Re-run AI feedback on the interview to get the breakdown.</p>'}
 ${tf}
 <div class="cr"><div class="note">Not convinced by this auto score?</div><div class="ctl"><input id="ovv" type="number" min="0" max="100" placeholder="0-100" style="width:110px" aria-label="Override score"><button class="btn" data-ov="set" data-id="${i.id}">Override score</button>${i.override_score!=null?`<button class="btn ghost" data-ov="reset" data-id="${i.id}">Use auto score</button>`:''}</div></div></div></div></div>`);
}
$('#modal').onclick=async e=>{const b=e.target.closest('button');if(e.target.id==='modal'||(b&&b.dataset.close)){$('#modal').classList.add('hide');return}if(!b)return;
 if(b.dataset.mode)compare(b.dataset.mode);
 if(b.dataset.rp)report(+b.dataset.rp);
 if(b.dataset.sc)$('#sc1').classList.toggle('hide');
 if(b.dataset.tr){const p=$('#trp');try{p.textContent=(await api('/api/interviews/'+b.dataset.tr+'/transcript')).transcript||'No transcript.';p.classList.toggle('hide')}catch(x){$('#msg').textContent=x.message}}
 if(b.dataset.ov){const v=b.dataset.ov==='reset'?null:$('#ovv').value;if(v!==null&&(v===''||+v<0||+v>100)){$('#msg').textContent='Enter a score from 0 to 100.';return}await run(()=>api('/api/interviews/'+b.dataset.id+'/override',{score:v}));report(+b.dataset.id)}};
const tabs=["Overview","Jobs","Candidates","Interviews","Reports"],nav=$('#nav');
function show(n){tabs.forEach(t=>$('#v-'+t.toLowerCase()).classList.toggle('hide',t!==n));document.querySelectorAll('.nv').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===n));try{history.replaceState(null,'','#'+n.toLowerCase())}catch(e){}$('.shell').classList.toggle('dm',n==='Overview');fitSide()}
const IC={Overview:sv(PI.dash),Jobs:sv(PI.job),Candidates:sv(PI.users),Interviews:sv(PI.mic),Reports:sv(PI.doc)},lab2=t=>t==='Overview'?'Dashboard':t;
tabs.forEach(t=>{[nav,$('#snav')].forEach((p,k)=>{const b=document.createElement('button');b.className='nv';b.dataset.t=t;b.innerHTML=(k?IC[t]+' ':'')+lab2(t);b.setAttribute('role','tab');b.onclick=()=>show(t);p.append(b)})});
$('#ja').onclick=()=>run(async()=>{await api('/api/jobs',{title:$('#jt').value.trim(),dept:$('#jd').value.trim(),location:$('#jl').value.trim(),tech_stack:$('#jk').value.trim()});['#jt','#jd','#jl','#jk'].forEach(s=>$(s).value='')});
$('#jtb').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.st)run(()=>api('/api/jobs/'+b.dataset.st+'/stack',{tech_stack:document.querySelector('[data-js="'+b.dataset.st+'"]').value.trim()}));else if(b.dataset.t)run(()=>api('/api/jobs/'+b.dataset.t+'/toggle',{}))};
$('#ca').onclick=()=>run(async()=>{await api('/api/candidates',{name:$('#cn').value.trim(),email:$('#ce').value.trim(),job_id:+$('#cj').value||null});$('#cn').value=$('#ce').value=''});
$('#srch').oninput=drawC;$('#sortc').onchange=drawC;$('#cclr').onclick=()=>{SEL.clear();drawC()};$('#cgo').onclick=()=>compare('h2h');$('#ctop').onclick=()=>{const rk=rankMap();SEL.clear();Object.keys(rk).filter(k=>rk[k]<=3).forEach(k=>SEL.add(+k));drawC();compare('h2h')};
$('#ctb').onchange=e=>{if(e.target.dataset.k){toggleSel(+e.target.dataset.k,e.target.checked);return}if(e.target.dataset.s)run(()=>api('/api/candidates/'+e.target.dataset.s+'/stage',{stage:e.target.value}))};
$('#ctb').onclick=e=>{const b=e.target.closest('button');if(b){$('#ic').value=b.dataset.i;show('Interviews')}};
$('#ia').onclick=()=>{if(!$('#ik').checked){$('#msg').textContent='Confirm the candidate’s consent first.';return}run(async()=>{await api('/api/interviews',{candidate_id:+$('#ic').value,meeting_url:$('#iu').value.trim(),scheduled_at:$('#iw').value||null,interviewer:$('#ii').value.trim(),tech_stack:$('#it').value.trim(),panel:$('#ip').value.trim()||'Panel A'});$('#iu').value='';$('#it').value='';$('#ik').checked=false})};
$('#ilist').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.sd)run(()=>api('/api/interviews/'+b.dataset.sd+'/duration',{minutes:+document.querySelector('[data-dn="'+b.dataset.sd+'"]').value}));
 if(b.dataset.sp)run(()=>api('/api/interviews/'+b.dataset.sp+'/panel',{panel:document.querySelector('[data-pn="'+b.dataset.sp+'"]').value.trim()}));
 if(b.dataset.rp)report(+b.dataset.rp);
 if(b.dataset.b)run(()=>api('/api/interviews/'+b.dataset.b+'/bot',{}));
 if(b.dataset.re)run(()=>api('/api/interviews/'+b.dataset.re+'/reanalyze',{}));
 if(b.dataset.tr){const p=$('#t'+b.dataset.tr);try{p.textContent=(await api('/api/interviews/'+b.dataset.tr+'/transcript')).transcript||'No transcript.';p.classList.toggle('hide')}catch(x){$('#msg').textContent=x.message}}};
setInterval(()=>{if(D.interviews.some(i=>i.status==='bot_sent'||i.status==='analyzing'))load()},15000);
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
const h=(location.hash||'').slice(1);show(tabs.find(t=>t.toLowerCase()===h)||'Overview');load();
</script>
</body>
</html>
